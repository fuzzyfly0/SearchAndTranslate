name: Release

on:
  push:
    tags:
      # Plain semver tags (e.g. 0.2.1); old v-prefixed tags still work.
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4

      - name: Check tag matches versionName (semver X.Y.Z)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG_NAME is not semver (expected MAJOR.MINOR.PATCH, e.g. 0.2.1)"; exit 1
          fi
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match versionName $NAME in app/build.gradle.kts"; exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust (host uniffi-bindgen)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APK_DIR="app/build/outputs/apk/release"
          BT_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in "$APK_DIR"/*.apk; do
            echo "Verifying signature: $apk"
            "$BT_DIR/apksigner" verify --print-certs "$apk"
          done

      - name: Generate SHA-256 checksums
        working-directory: app/build/outputs/apk/release
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          echo "Checksums generated:"
          cat SHA256SUMS.txt

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Release notes: fastlane changelog for this versionCode (if present)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NOTES="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$NOTES" ]; then
            # GitHub release body: same text, section headings (lines that aren't
            # bullets) in bold. The fastlane file stays plain text for F-Droid.
            sed -E 's/^([^•[:space:]].*[^[:space:]])[[:space:]]*$/**\1**/' "$NOTES" > release_notes.md
            echo "notes=release_notes.md" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.version }}
          body_path: ${{ steps.version.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.keystore
