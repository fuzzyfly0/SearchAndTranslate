name: Build APK

on:
  push:
    branches: ["**"]
    tags-ignore:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  # "Run workflow" in the Actions tab: the APKs are signed with the release key, so a
  # test build installs as an update over the release. Plain pushes stay unsigned.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust (host uniffi-bindgen)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Decode signing keystore (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
          else
            echo "No signing keystore available, building unsigned"
          fi

      - name: Build Release APK (signed on manual runs, unsigned otherwise)
        env:
          KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.KEY_PASSWORD || '' }}
        run: ./gradlew assembleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Find release APKs
        id: find-apk
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ -d "$APK_DIR" ]; then
            APK_COUNT=$(find "$APK_DIR" -name "*.apk" | wc -l)
            echo "apk_dir=$APK_DIR" >> $GITHUB_OUTPUT
            echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
            echo "Found $APK_COUNT release APK(s)"
          else
            echo "No release APK directory found"
            echo "apk_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload release APKs
        if: steps.find-apk.outputs.apk_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
